name: Manual Run Deploy 3-Tier

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Image Tag'
        required: true
        default: 'BD-2023'
      tier:
        description: 'App Tier to deploy'
        required: true
        type: choice
        options:
          - frontend
          - backend
          - database
        default: 'backend'

env:
  REGISTRY: docker.io
  IMAGE_NAME: jogaraoreddy/${{ github.event.inputs.tier }}-app 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./${{ github.event.inputs.tier }}
        load: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}

    # Security Scanning Step 1: Docker Scout
    - name: Docker Scout Scan
      uses: docker/scout-action@v1
      with:
        command: quickview,cves
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}
        only-severities: critical,high
        exit-code: false

    # Security Scanning Step 2: Trivy
    - name: Run Trivy Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}'
        format: 'table'
        exit-code: '0' 
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./${{ github.event.inputs.tier }}
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}

# SSH to Local Machine and Deploy via Helm
    - name: SSH to Local Machine & Run Helm
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          # 1. Ensure the repository exists on your local machine, or clone it
          if [ ! -d "3tier_application" ]; then
            git clone https://github.com/jogaraoreddy/3tier_application.git
          fi
          
          # 2. Enter the repository directory and pull latest changes
          cd 3tier_application
          git pull origin main
          
          # 3. Run the Helm deployment locally
          helm upgrade --install ${{ github.event.inputs.tier }}-release ./${{ github.event.inputs.tier }} \
            --namespace 3-tier-app \
            --set image.tag=${{ github.event.inputs.image_tag }} \
            --create-namespace \
            --wait

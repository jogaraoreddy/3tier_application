name: Deploy to Kind Cluster

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Image Tag'
        required: true
        default: 'KIND-2026'
      tier:
        description: 'App Tier to deploy'
        required: true
        type: choice
        options:
          - frontend
          - backend
          - database
        default: 'backend'

env:
  REGISTRY: docker.io
  IMAGE_NAME: jogaraoreddy/${{ github.event.inputs.tier }}-app 

jobs:
  build-and-deploy-kind:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./${{ github.event.inputs.tier }}
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}

    - name: SSH to Host and Deploy to Kind
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          if [ ! -d "3tier_application" ]; then
            git clone https://github.com/jogaraoreddy/3tier_application.git
          fi
          cd 3tier_application
          git pull origin main
          
          # Pull down the fresh image locally on your Ubuntu machine
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}
          
          # Sideload the image directly into Kind nodes
          kind load docker-image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }} --name three-tier-cluster
          
          # Deploy with Helm
          helm upgrade --install ${{ github.event.inputs.tier }}-release ./${{ github.event.inputs.tier }} \
            --namespace 3-tier-app \
            --set image.tag=${{ github.event.inputs.image_tag }} \
            --create-namespace
